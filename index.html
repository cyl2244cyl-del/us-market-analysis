<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>미장분석</title>
  <style>
    :root { color-scheme: light; --bg:#f4f6f8; --panel:#fff; --text:#172033; --muted:#667085; --line:#dfe4ea; --navy:#17385f; --gold:#a87834; --blue:#2f6f9f; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; line-height:1.6; letter-spacing:0; }
    .topbar { border-top:4px solid var(--navy); border-bottom:1px solid var(--line); background:#fff; }
    .topbar-inner,.page { width:min(1080px,calc(100% - 40px)); margin:0 auto; }
    .topbar-inner { padding:16px 0; color:var(--navy); font-weight:850; }
    .page { padding:56px 0 80px; }
    .eyebrow { color:var(--gold); font-size:.76rem; font-weight:850; }
    h1 { margin:7px 0 10px; color:var(--navy); font-size:2.3rem; line-height:1.18; letter-spacing:0; }
    .lede { max-width:720px; color:var(--muted); }
    .report-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; margin-top:34px; }
    .report-link { min-height:210px; padding:22px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--text); text-decoration:none; display:flex; flex-direction:column; }
    .report-link:hover { border-color:#9eb5ca; background:#fbfcfd; }
    .number { color:var(--gold); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.76rem; font-weight:850; }
    h2 { margin:12px 0 7px; color:var(--navy); font-size:1.3rem; letter-spacing:0; }
    .description { color:var(--muted); font-size:.9rem; }
    .open { margin-top:auto; padding-top:18px; color:var(--blue); font-weight:800; }
    @media(max-width:680px){.topbar-inner,.page{width:min(100% - 20px,1080px)}.page{padding-top:38px}.report-grid{grid-template-columns:1fr}h1{font-size:1.85rem}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner">미장분석</div></header>
  <main class="page">
    <div class="eyebrow">US EQUITY RESEARCH</div>
    <h1>시장 기록과 실적 노트</h1>
    <p class="lede">9개 관심 종목의 일일 가격 흐름과 실적 발표 내용을 분리해 기록합니다.</p>
    <div class="report-grid">
      <a class="report-link" href="일일리포트/나스닥_통합_리포트.html"><span class="number">01</span><h2>일일 주가 리포트</h2><span class="description">등락률, 히트맵, 가격·밸류에이션 추이와 주요 변동 원인</span><span class="open">날짜별 리포트 열기 →</span></a>
      <a class="report-link" href="실적리포트/index.html"><span class="number">02</span><h2>실적 발표 트래커</h2><span class="description">발표 일정, 핵심 실적, 가이던스와 발표 후 시장 반응</span><span class="open">종목별 실적 노트 열기 →</span></a>
    </div>
  </main>
</body>
</html>
